<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Tournaments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Martian+Mono:wght@100..800&family=Unbounded:wght@500..900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <header class="masthead">
    <a class="lockup" href="#/">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M 8 30 L 15 14 L 22 24 L 30 8" fill="none" stroke="var(--line-strong)" stroke-width="1.2"></path>
        <circle cx="8" cy="30" r="2.2" fill="var(--text)"></circle>
        <circle cx="15" cy="14" r="2.2" fill="var(--text)"></circle>
        <circle cx="22" cy="24" r="2.2" fill="var(--text)"></circle>
        <path d="M30 3.4 L31.2 6.8 L34.6 8 L31.2 9.2 L30 12.6 L28.8 9.2 L25.4 8 L28.8 6.8 Z" fill="var(--gold)"></path>
      </svg>
      <span class="lockup-text">
        <span class="lockup-star">STAR</span>
        <span class="lockup-sub">Tournaments</span>
      </span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="events">Events</a>
      <a href="#/matches" data-nav="matches">Matches</a>
      <a href="#/standings" data-nav="standings">Standings</a>
      <a href="#/rosters" data-nav="rosters">Rosters</a>
      <a href="#/players" data-nav="players">Players</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 22px;">
      <label class="role-label mono" for="role">VIEW AS</label>
      <select id="role" class="role-select mono">
        <option value="audience">Audience</option>
        <option value="player">Player · aus#MTB</option>
        <option value="org">Org · QOR</option>
        <option value="staff">Staff · Head Caster</option>
        <option value="admin">Admin · MTB Events</option>
        <option value="sponsor">Sponsor · Red Bull</option>
        <option value="creator">Creator · revrzd</option>
      </select>
      <div class="clock mono" id="clock"></div>
    </div>
  </header>

  <div id="rolebar" class="rolebar"></div>

  <main id="view"></main>

  <footer class="footer mono">
    <div>STAR TOURNAMENTS · ORGANIZER MTB EVENTS · 2026 SEASON</div>
    <div id="footer-stats">6 EVENTS · 18,000 IN PRIZES · <span class="gold">&#10022;</span> = CHAMPION</div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
